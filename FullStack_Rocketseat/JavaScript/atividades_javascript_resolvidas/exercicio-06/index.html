<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 06 - Conversor de Temperatura</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="temperature-page">
    <section class="converter-card">
      <header>
        <div class="symbol">℃</div>
        <h1>Conversor de Temperatura</h1>
        <p>Converta valores de Celsius para Fahrenheit utilizando uma fórmula matemática simples.</p>
      </header>

      <div class="formula">
        Fórmula: F = (C × 9/5) + 32
      </div>

      <label for="celsius">Temperatura em Celsius</label>
      <input id="celsius" type="number" step="0.1" placeholder="Ex.: 25">

      <button id="btnConverter" type="button">Converter</button>

      <div id="resultado" class="result">
        Informe uma temperatura para converter.
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
