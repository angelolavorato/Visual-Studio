<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 01 - Card de Apresentação</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="profile-card">
        <div class="profile-avatar">JS</div>

        <h1>Card de Apresentação Pessoal</h1>

        <div class="profile-info">
          <p><strong>Nome:</strong> <span id="nome">Ana Silva</span></p>
          <p><strong>Idade:</strong> <span id="idade">17</span> anos</p>
          <p>
            <strong>Curso:</strong>
            <span id="curso">Técnico em Informática</span>
          </p>
          <p><strong>Cidade:</strong> <span id="cidade">Ubá - MG</span></p>
        </div>

        <p id="apresentacao" class="presentation">
          Clique no botão para gerar uma apresentação personalizada usando
          JavaScript.
        </p>

        <button id="btnAtualizar" type="button">Atualizar apresentação</button>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
